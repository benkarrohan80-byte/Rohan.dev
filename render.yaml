services:
  - type: web
    name: rohan-portfolio-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
        placeholder: "your-mongodb-atlas-uri-here"
      - key: NOTIFICATION_EMAIL
        sync: false
        placeholder: "your-email@gmail.com"
      - key: SMTP_HOST
        sync: false
        placeholder: "smtp.gmail.com"
      - key: SMTP_PORT
        sync: false
        value: "587"
      - key: SMTP_USER
        sync: false
        placeholder: "your-smtp-sender-email@gmail.com"
      - key: SMTP_PASS
        sync: false
        placeholder: "your-smtp-app-password"
